# REVIEW ONLY. No resource exists from this manifest; importing it provisions.
services:
  - type: web
    name: maintainai-robotics-api
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: ./scripts/build-native.sh
    startCommand: ./scripts/start-native.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        sync: false
      - key: MAINTAINAI_ALLOWED_ORIGINS
        sync: false
      - key: MAINTAINAI_HOSTED
        value: "1"
      - key: PG_POOL_MAX
        value: "4"
      - key: MAINTAINAI_STATIC_DIR
        value: frontend/dist
      - key: NODE_VERSION
        value: 24.19.0
      - key: DEMO_READONLY
        value: "0"
